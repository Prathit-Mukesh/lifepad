d/gym/">🧠 Prajnify</a><a class="nav-tab active" href="/lifepad/games/">🎮 Games</a><a class="nav-tab" href="/lifepad/lifepad/">✨ LifePad</a></nav><div class="theme-wrap"><button class="theme-btn" aria-label="Choose colour theme" title="Colour theme">🎨</button></div></div></header><div class="arena"><div class="arena-inner"><div class="fade-in" style="display:flex;flex-direction:column;gap:16px"><div><div class="a-eyebrow">the game room · solo, duels &amp; parties</div><h1 class="a-title">Play is how brains <span class="a-grad">stay young</span>.</h1><p class="a-sub" style="margin-top:8px;max-width:52ch">Quick games for one, head-to-head duels on a single phone, and party rounds for the whole family.</p></div><div class="a-chiprow"><button class="a-chip on">All</button><button class="a-chip">🧍 Solo</button><button class="a-chip">🧑‍🤝‍🧑 2 Players</button><button class="a-chip">👨‍👩‍👧‍👦 Group</button></div><div class="mod-grid"><button class="mod-tile" style="--mc:#4ECD7A"><span class="m-ico">🟩</span><h3>Word Guess</h3><p>The famous 5-letter guessing game. Six tries, colour clues.</p><span class="m-meta"><span style="color:#4ECD7A">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FFD060"><span class="m-ico">🌼</span><h3>Word Bloom</h3><p>Six letters, 75 seconds — forge every word you can find.</p><span class="m-meta"><span style="color:#FFD060">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#38C6F4"><span class="m-ico">🌐</span><h3>Trivia Trek</h3><p>Nine awareness worlds: movies, history, animals, economy…</p><span class="m-meta"><span style="color:#38C6F4">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FF9F2E"><span class="m-ico">🎭</span><h3>Emoji Riddles</h3><p>Guess the movie from emojis alone. Harder than it looks.</p><span class="m-meta"><span style="color:#FF9F2E">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#7B5EFF"><span class="m-ico">🎲</span><h3>Number Hunt</h3><p>A secret number between 1 and 100. Corner it in 7 guesses.</p><span class="m-meta"><span style="color:#7B5EFF">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#2EC9B0"><span class="m-ico">🫲</span><h3>Reaction Flash</h3><p>Wait for green. Tap. How fast are your reflexes?</p><span class="m-meta"><span style="color:#2EC9B0">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#38C6F4"><span class="m-ico">🔢</span><h3>Number Rush</h3><p>Tap 1→25 in order. The classic Schulte attention table.</p><span class="m-meta"><span style="color:#38C6F4">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#C77DFF"><span class="m-ico">🎴</span><h3>Memory Pairs</h3><p>Flip and match all 8 pairs in as few moves as possible.</p><span class="m-meta"><span style="color:#C77DFF">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FFB44D"><span class="m-ico">🔢</span><h3>2048</h3><p>Swipe, merge, double. The legendary tile puzzle.</p><span class="m-meta"><span style="color:#FFB44D">1 player</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#5AD6FF"><span class="m-ico">🤔</span><h3>Would You Rather</h3><p>Impossible choices, big debates. The insta-story classic.</p><span class="m-meta"><span style="color:#5AD6FF">2–8 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#DA9BFF"><span class="m-ico">👉</span><h3>Most Likely To</h3><p>Everyone points on three… two… one. Tally the votes.</p><span class="m-meta"><span style="color:#DA9BFF">2–8 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FF7FA8"><span class="m-ico">🖐️</span><h3>Never Have I Ever</h3><p>Five lives each. The confessions game, family edition.</p><span class="m-meta"><span style="color:#FF7FA8">2–8 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FF5F8F"><span class="m-ico">⚔️</span><h3>Tap Duel</h3><p>Two players, one screen. First to tap on GO wins. Best of 5.</p><span class="m-meta"><span style="color:#FF5F8F">2 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FF9F2E"><span class="m-ico">🥊</span><h3>Math Duel</h3><p>Face-to-face mental math. First correct answer takes the point.</p><span class="m-meta"><span style="color:#FF9F2E">2 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#7B5EFF"><span class="m-ico">⭕</span><h3>Tic-Tac-Toe</h3><p>The eternal strategy classic — with a running score.</p><span class="m-meta"><span style="color:#7B5EFF">2 players</span><span>play ▶</span></span></button><button class="mod-tile" style="--mc:#FFD060"><span class="m-ico">🎉</span><h3>Quiz Party</h3><p>Pass the phone. 2–8 players, rapid questions, podium finish.</p><span class="m-meta"><span style="color:#FFD060">2–8 players</span><span>play ▶</span></span></button></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{}},"page":"/games","query":{},"buildId":"EJxU-_iQ4I51oBsy4aVZS","assetPrefix":"/lifepad","nextExport":true,"autoExport":true,"isFallback":false,"scriptLoader":[]}</script></body></html>
