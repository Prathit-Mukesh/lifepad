/* ═══════════════ RESET & BASE ═══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

  font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden;

}
button,input,textarea,select{font-family:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}

::-webkit-scrollbar-track{background:transparent}

::selection{background:rgba(255,159,46,.3);color:#fff}

}

/* ═══════════════ TYPOGRAPHY ═══════════════ */

.dm{font-family:'DM Sans',sans-serif}

/* ═══════════════ ANIMATIONS ═══════════════ */

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}60%{transform:translateX(9px)}80%{transform:translateX(-5px)}}

@keyframes flashIn{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ═══════════════ BACKDROP ═══════════════ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .grad{position:absolute;inset:0}
#bg .g1{background:radial-gradient(ellipse 80% 60% at 15% 8%,rgba(123,94,255,.10),transparent 70%)}
#bg .g2{background:radial-gradient(ellipse 70% 80% at 88% 92%,rgba(46,201,176,.075),transparent 70%)}
#bg .g3{background:radial-gradient(ellipse 55% 45% at 50% 48%,rgba(255,159,46,.045),transparent 70%)}
#bg .scan{background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.006) 3px,rgba(255,255,255,.006) 4px)}
#bg .orb{position:absolute;border-radius:50%;animation:floatY var(--dur,34s) ease-in-out infinite}
#bg .ring{position:absolute;border-radius:50%;animation:mandalaSpin var(--rd,60s) linear infinite}

/* ═══════════════ SHELL ═══════════════ */
#shell{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:16px 14px 80px;min-height:100vh}

/* ═══════════════ GLASS CARD ═══════════════ */
.card{
  background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.card.glow{box-shadow:0 0 34px var(--gc,rgba(123,94,255,.12)),inset 0 1px 0 rgba(255,255,255,.07)}

/* ═══════════════ LIFT ═══════════════ */
.lift{transition:transform .17s cubic-bezier(.34,1.56,.64,1),box-shadow .17s,border-color .17s,background .17s}
.lift:hover{transform:translateY(-3px)}

/* ═══════════════ BUTTON ═══════════════ */
.btn{
  border-radius:12px;padding:13px 22px;font-weight:600;font-size:14px;
  letter-spacing:.3px;color:#fff;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;transition:all .2s;border:1.5px solid transparent;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.btn.sm{padding:9px 15px;font-size:12px;border-radius:10px}

/* ═══════════════ ANSWER BUTTON ═══════════════ */
.ans{
  width:100%;display:flex;align-items:center;gap:11px;text-align:left;

  border-radius:13px;padding:14px 16px;font-size:13.5px;font-weight:500;
  color:#fff;transition:all .2s;
}
.ans:not(.locked):hover{background:rgba(255,255,255,.07);transform:translateY(-2px)}
.ans.ok{background:rgba(78,205,122,.15);border-color:var(--ok);animation:correctGlow .55s ease}
.ans.bad{background:rgba(255,95,143,.15);border-color:var(--bad);animation:shake .42s ease}
.ans.locked{cursor:default}
.ans .lbl{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;
  background:rgba(255,255,255,.07);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
}

/* ═══════════════ TAG / CHIP ═══════════════ */
.tag{

/* ═══════════════ TOAST ═══════════════ */

/* ── MATH (generated) ── */
function genMath(level){
  const t = Math.min(level,10);
  const ops = t<=2?["+","-"] : t<=4?["+","-","x"] : t<=7?["+","-","x","/"] : ["x","/","sq","rt","pct"];
  const op = pick(ops);
  let q, ans;
  if(op==="+"){ const a=rand(t*8,t*40), b=rand(t*5,t*25); q=a+" + "+b; ans=a+b; }
  else if(op==="-"){ const a=rand(t*20,t*60), b=rand(5,Math.max(6,t*18)); q=a+" − "+b; ans=a-b; }
  else if(op==="x"){ const a=rand(2,t+14), b=rand(2,t+10); q=a+" × "+b; ans=a*b; }
  else if(op==="/"){ const b=rand(2,14), c=rand(2,18); q=(b*c)+" ÷ "+b; ans=c; }
  else if(op==="sq"){ const a=rand(2,22); q=a+"²"; ans=a*a; }
  else if(op==="rt"){ const a=rand(1,25); q="√"+(a*a); ans=a; }
  else { const a=rand(10,99), b=rand(10,99); q=a+"% of "+b; ans=Math.round(a*b/100); }
  const wrong=new Set(); const offs=[-15,-10,-7,-5,-4,-3,-2,-1,1,2,3,4,5,7,10,15];
  let guard=0;
  while(wrong.size<3 && guard++<200){ const w=ans+pick(offs); if(w!==ans && w>0) wrong.add(w); }
  while(wrong.size<3){ wrong.add(ans+wrong.size+1); }
  return { q:q, ans:ans, opts:shuffle([ans].concat([...wrong])) };
}

/* ═══════════════════════════════════════════════════
   HEURISTIC WRITING SCORER (offline demo grader)
   Real build calls the Claude API — see launch guide.
═══════════════════════════════════════════════════ */
function scoreText(text, keys, minWords){
  const t = (text||"").trim();
  const words = t.split(/\s+/).filter(Boolean);
  const n = words.length;
  const need = minWords || 12;
  if(n < 4) return null;

  // 1. Length (0-30)
  const lenScore = Math.min(30, Math.round((n/Math.max(need,1))*22));
  // 2. Vocabulary diversity (0-25)
  const lower = words.map(w=>w.toLowerCase().replace(/[^a-z]/g,'')).filter(Boolean);
  const uniq = new Set(lower).size;
  const divScore = Math.min(25, Math.round((uniq/Math.max(lower.length,1))*30));
  // 3. Keyword relevance (0-25)
  const low = t.toLowerCase();
  let hits = 0;
  (keys||[]).forEach(k=>{ if(low.indexOf(k)>=0) hits++; });
  const keyScore = Math.min(25, hits*6);
  // 4. Structure — sentences & word length (0-20)
  const sentences = t.split(/[.!?;]+/).filter(s=>s.trim().length>3).length;
  const avgLen = lower.reduce((a,w)=>a+w.length,0)/Math.max(lower.length,1);
  const structScore = Math.min(20, sentences*4 + (avgLen>5?6:avgLen>4?3:0));

  let total = lenScore + divScore + keyScore + structScore;
  total = Math.max(12, Math.min(98, total));

  const grade = total>=88?"S" : total>=74?"A" : total>=58?"B" : total>=40?"C" : "D";
  const notes = [];
  if(n < need)        notes.push("Try expanding — depth earns more than brevity here.");
  else                notes.push("Good length and development.");
  if(hits >= 3)       notes.push("Strong topical relevance — you hit the core ideas.");
  else if(hits >= 1)  notes.push("Partially on-target; push further into the specific concept.");
  else                notes.push("Aim closer to the exact concept the prompt asks about.");
  if(uniq/Math.max(lower.length,1) > .72) notes.push("Excellent vocabulary variety.");
  else                notes.push("Vary your word choice to lift the score.");

  return {
    score: total, grade: grade,
    feedback: notes.join(" "),
    strengths: hits>=2 ? "On-topic and specific" : "Clear attempt",
    improve:  n<need ? "Add one more developed sentence" : "Sharpen precision of word choice"
  };
}

const MEMC=["#FF5F8F","#7B5EFF","#2EC9B0","#FFD060","#FF9F2E","#C77DFF","#4ECD7A","#38C6F4"];
function memCountdown(){
  stopTick();
  TICK=setInterval(function(){
    S.g.cd--;
    if(S.g.cd<0){ stopTick(); S.g.phase="show"; S.g.show=0; render(); memShow(); }
    else render();
  },900);
}
function memShow(){
  const g=S.g;
  if(g.show>=g.seq.length){ g.flash=null; g.phase="recall"; render(); return; }
  g.flash=g.seq[g.show];
  render();
  const speed=Math.max(320,660-S.user.level*28);
  setTimeout(function(){
    g.flash=null; render();
    setTimeout(function(){ g.show++; memShow(); },200);
  },speed);
}

  const g=S.g, m=MOD("memory");
  if(g.phase==="cd"){

      '<div class="mono" style="font-size:10px;color:'+P.muted+';letter-spacing:4px">'+

      'background:'+(g.flash?'radial-gradient(circle at 38% 32%,'+g.flash+','+g.flash+'88)':'rgba(255,255,255,.03)')+';'+

      '<div style="font-size:66px">'+(perfect?'🎯':'💥')+'</div>'+

        return '<div style="width:28px;height:28px;border-radius:50%;background:'+c+';border:3px solid '+

      }).join('')+'</div>'+

    '</div>'+

function memTap(ci){
  const g=S.g, c=MEMC[ci];
  g.guess.push(c);
  if(g.guess.length>=g.seq.length){
    const right = g.guess.filter(function(v,i){ return v===g.seq[i]; }).length;
    const perfect = right===g.seq.length;
    g.pts = perfect ? g.len*28 : Math.round(right/g.seq.length*g.len*18);
    setTimeout(function(){ g.phase="done"; render(); },420);
  }
  render();
}

/* ═══════════════════════════════════════════════════
   9 · BRAIN CRUSHER
═══════════════════════════════════════════════════ */
function genCrusher(level){
  const kinds=["sequence","riddle","lateral","crypto"];
  const k=pick(kinds);
  if(k==="sequence"){
    const s=pick(SEQS);
    return {kind:"sequence",title:"Sequence Decoder",
      desc:"Find the pattern and complete the sequence:\n\n"+s.s.join("  →  ")+"  →  ???",
      answer:s.n, hintText:"Pattern: "+s.r, numeric:true};
  }
  if(k==="riddle"){
    const r=pick(RIDDLES);
    return {kind:"riddle",title:"Mind Riddle",desc:r.q,opts:r.o,ansIdx:r.a,
      hintText:"Think laterally, not literally. The answer is an everyday object or idea."};
  }
  if(k==="lateral"){
    const l=pick(LATERALS);
    return {kind:"lateral",title:"Lateral Thinking",desc:l.q,hintText:l.hint,answer:l.a};
  }
  const c=pick(CRYPTOS);
  return {kind:"crypto",title:"Cryptarithmetic",
    desc:"Each letter represents one unique digit (0–9). Solve:\n\n"+c.eq,
    hintText:c.hint, answer:c.hint};
}

    '<div id="ringslot">'+ring(g.t,g.total)+'</div></div>';
  out += card('<div style="font-size:14px;line-height:1.9;color:'+P.text+';white-space:pre-line">'+esc(g.desc)+'</div>',

  if(!g.done){

function stSubmit(){
  const g=S.g; stopTick();
  let pts=0;
  if(g.kind==="sequence"){
    const n=document.getElementById('st-in');
    const v=parseInt((n?n.value:'').trim(),10);
    g.val=n?n.value:'';
    pts = (v===g.answer) ? Math.max(20, Math.round(g.t*1.8)) : 0;
  } else if(g.kind==="riddle"){
    pts = (g.sel===g.ansIdx) ? Math.max(20, Math.round(g.t*1.5)) : 0;
  } else {
    const n=document.getElementById('st-in');
    g.val=n?n.value:'';
    pts = Math.min(150, wc(g.val)*4+20);
  }
  if(g.hint) pts = Math.max(0, pts-20);
  g.score=Math.round(pts); g.done=true;
  if(pts>0) scorePop(g.score);
  render();
}

function genFocus(){
  const kinds=["odd","count","rapid","stroop","scan"];
  const k=pick(kinds);
  if(k==="odd"){
    const grid=Array(16).fill("●"); const idx=rand(0,15); grid[idx]="◆";
    return {kind:"odd",title:"Spot the Odd One",instr:"Tap the DIFFERENT shape as fast as you can.",grid:grid,idx:idx,t:10,total:10};
  }
  if(k==="count"){
    const pool=["🔴","🔵","🟡","🟢"], target=pick(pool);
    const items=Array.from({length:25},()=>pick(pool));
    return {kind:"count",title:"Count the Target",instr:"Count every "+target+" you can see before time runs out.",
      target:target,items:items,answer:items.filter(x=>x===target).length,t:16,total:16};
  }
  if(k==="rapid"){
    const target=pick(["⭐","💎","🔥","⚡","🎯"]);
    const dist=["○","□","△","▽","◇","◈","⬡","⬢"];
    const seq=Array.from({length:16},()=>rand(0,3)===0?target:pick(dist));
    return {kind:"rapid",title:"Rapid Response",instr:"Tap ONLY "+target+" — ignore every other symbol.",
      target:target,seq:seq,t:20,total:20};
  }
  if(k==="stroop"){
    const cols=["RED","BLUE","GREEN","YELLOW"];
    const map={RED:"#ff4444",BLUE:"#4488ff",GREEN:"#44ee88",YELLOW:"#ffdd00"};
    const word=pick(cols), ink=pick(cols.filter(c=>c!==word));
    return {kind:"stroop",title:"Stroop Conflict",instr:"Name the INK COLOUR of the word — not what the word says.",
      word:word,ink:ink,map:map,answer:ink,t:14,total:14};
  }
  const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const target=pick(L);
  const grid=Array.from({length:36},()=>rand(0,4)===0?target:pick(L.filter(x=>x!==target)));
  return {kind:"scan",title:"Grid Scanner",instr:"Find and count every '"+target+"' hidden in the grid.",
    target:target,grid:grid,answer:grid.filter(x=>x===target).length,t:20,total:20};
}

/* ═══════════════════════════════════════════════════
   SESSION COMPLETION
═══════════════════════════════════════════════════ */
function finish(score,correct){
  stopTick();
  let u=S.user;
  const xpGain  = Math.floor(score/2.5)+22;
  const ptsGain = Math.floor(score/1.8)+12;
  const beforeG = u.gold, beforeD = u.diamonds;
  u = addPoints(u, ptsGain);
  const goldGain = u.gold - beforeG + (u.diamonds-beforeD)*100;
  const diaGain  = u.diamonds - beforeD;
  u.xp += xpGain;
  u.level = Math.floor(u.xp/150)+1;
  const ds = Object.assign({}, u.dailySessions);
  ds[S.mode] = (ds[S.mode]||0)+1;
  u.dailySessions = ds;
  if(u.lastLogin !== today()){ u.streak = (u.streak||0)+1; u.lastLogin = today(); }
  u.totalSessions = (u.totalSessions||0)+1;
  saveUser(u);
  S.last = {score:score, correct:correct, xp:xpGain, pts:ptsGain,
            gold:Math.max(0,goldGain), diamond:diaGain, maxed: ds[S.mode]>=10};
  S.screen="result";
  render();
}

/* ═══════════════════════════════════════════════════
   EVENT DELEGATION
═══════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const a = t.getAttribute('data-act');
  if(!a) return;
  const D = k => t.getAttribute('data-'+k);

  switch(a){
    /* ── AUTH ── */
    case "auth-tab":  S.authTab=D('t'); S.authErr=""; render(); break;
    case "auth-go":   doAuth(); break;
    case "auth-demo": demoAccount(); break;
    case "ob-next":   S.onboard++; render(); break;
    case "ob-done":   S.onboard=-1; S.user=LS.get("praj_"+S.pendingMail); S.screen="home"; render(); break;

    /* ── NAV ── */
    case "tab":     S.tab=D('t'); render(); break;
    case "home":    stopTick(); S.screen="home"; S.mode=null; render(); break;
    case "exit":    stopTick(); S.screen="home"; S.mode=null; render(); break;
    case "logout":  stopTick(); S.user=null; S.screen="auth"; S.onboard=-1; render(); break;
    case "profile": S.modal="profile"; render(); break;
    case "close-modal": if(e.target.closest('[data-stop]') && a!=="close-modal") break; S.modal=null; render(); break;
    case "share":   shareCard(); break;
    case "buy":     doBuy(parseInt(D('i'),10)); break;
    case "play":    startPlay(D('id')); break;
    case "retry":   startPlay(S.mode); break;

    /* ── MATH ── */
    case "math-pick": mathPick(parseInt(D('i'),10)); break;
    case "math-next": mathNext(); break;

    /* ── MCQ ── */
    case "mcq-pick": mcqPick(parseInt(D('i'),10)); break;
    case "mcq-next": mcqNext(); break;

    /* ── MEMORY ── */
    case "mem-tap":  memTap(parseInt(D('c'),10)); break;
    case "mem-done": finish(S.g.pts,1); break;

    /* ── WORD ── */
    case "word-check":  wordCheck(); break;
    case "word-reveal": S.g.reveal=true; render(); break;
    case "word-next":   wordNext(); break;

    /* ── WRITING ── */
    case "wr-submit": wrSubmit(); break;
    case "wr-next":   wrNext(); break;

    /* ── SITUATION ── */
    case "si-submit": siSubmit(); break;
    case "si-next":   siNext(); break;

    /* ── STRESS ── */
    case "st-hint":   S.g.hint=true; render(); break;
    case "st-opt":    S.g.sel=parseInt(D('i'),10); render(); break;
    case "st-submit": stSubmit(); break;
    case "st-done":   finish(S.g.score,1); break;

    /* ── FOCUS ── */
    case "fo-start":
      S.g.phase="playing"; render();
      startTick(function(){
        if(S.g.kind==="odd")      focusEnd(0,"Time ran out — speed matters here.");
        else if(S.g.kind==="rapid") foRapid();
        else if(S.g.kind==="stroop") focusEnd(0,"Time ran out.");
        else render();
      });
      break;
    case "fo-odd": {
      const i=parseInt(D('i'),10);
      focusEnd(i===S.g.idx ? Math.max(20,S.g.t*6) : 0,
               i===S.g.idx ? "Found it — sharp visual scanning." : "That was not the odd shape.");
      break;
    }
    case "fo-tap": {
      const i=parseInt(D('i'),10);
      S.g.taps[i]=true; render();
      break;
    }
    case "fo-rapid": foRapid(); break;
    case "fo-count": {
      const n=document.getElementById('fo-in');
      const v=parseInt((n?n.value:''),10);
      if(isNaN(v)){ toast("Enter a number first."); break; }
      const diff=Math.abs(v-S.g.answer);
      focusEnd(diff===0?65:Math.max(0,65-diff*14),
               diff===0?"Exact count — excellent sustained attention.":"Actual count was "+S.g.answer+".");
      break;
    }
    case "fo-stroop":   S.g.val=D('c'); render(); break;
    case "fo-stroopgo":
      focusEnd(S.g.val===S.g.answer?70:0,
               S.g.val===S.g.answer?"Correct — you overrode the word's interference.":"The ink colour was "+S.g.answer+".");
      break;
    case "fo-done": finish(S.g.score,1); break;

    /* ── READING ── */
    case "rd-open":
      S.g.book=D('id'); S.g.phase="read"; S.g.ch=0; S.g.qi=0; S.g.sel=null; S.g.score=0;
      window.scrollTo(0,0); render(); break;
    case "rd-quiz": S.g.phase="quiz"; S.g.qi=0; S.g.sel=null; window.scrollTo(0,0); render(); break;
    case "rd-pick": {
      if(S.g.sel!==null) break;
      const bk=BOOKS.find(b=>b.id===S.g.book);
      const pool=RQUIZ[S.g.book+"_"+S.g.ch];
      const i=parseInt(D('i'),10), ok=(i===pool[S.g.qi].a);
      S.g.sel={i:i,ok:ok};
      if(ok){ S.g.score+=40; scorePop(40); }
      render(); break;
    }
    case "rd-next": {
      const bk=BOOKS.find(b=>b.id===S.g.book);
      const pool=RQUIZ[S.g.book+"_"+S.g.ch];
      if(S.g.qi+1 < pool.length){ S.g.qi++; S.g.sel=null; render(); }
      else if(S.g.ch+1 < bk.chapters.length){
        S.g.ch++; S.g.qi=0; S.g.sel=null; S.g.phase="read"; window.scrollTo(0,0); render();
      }
      else finish(S.g.score, bk.chapters.length);
      break;
    }
  }
});

/* keyboard shortcuts */
document.addEventListener('keydown', function(e){
  if(e.key!=="Enter") return;
  if(S.screen==="play" && S.mode==="word" && S.g.fb!=="ok"){ e.preventDefault(); wordCheck(); }
  if(!S.user && S.onboard<0){ e.preventDefault(); doAuth(); }
});

/* live word counter */
document.addEventListener('input', function(e){
  if(e.target.id==="wr-in"){
    S.g.text = e.target.value;
    const c=document.getElementById('wr-count');
    if(c) c.textContent = wc(e.target.value)+" words";
  }
  if(e.target.id==="w-in") S.g.typed = e.target.value.toUpperCase();
  if(/^si-\d$/.test(e.target.id)) S.g.ans[parseInt(e.target.id.split('-')[1],10)] = e.target.value;
  if(e.target.id==="st-in") S.g.val = e.target.value;
});

/* ═══════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════ */
function startPlay(id){
  const used=(S.user.dailySessions||{})[id]||0;
  if(used>=10){ toast("Daily limit reached for this module."); return; }
  S.mode=id; S.screen="play";
  initGame(id);
  render();
  if(id==="math") startTick(function(){ render(); });
  window.scrollTo(0,0);
}

function doAuth(){
  const nameEl=document.getElementById('a-name');
  const mail=(document.getElementById('a-mail')||{}).value||'';
  const pass=(document.getElementById('a-pass')||{}).value||'';
  const name=nameEl?nameEl.value:'';
  const t=S.authTab;

  if(!mail||!pass||(t==="signup"&&!name)){ S.authErr="All fields are required."; render(); return; }
  if(mail.indexOf('@')<0){ S.authErr="Enter a valid email address."; render(); return; }
  if(pass.length<4){ S.authErr="Password must be at least 4 characters."; render(); return; }

  const key="praj_"+mail.toLowerCase();
  if(t==="login"){
    const st=LS.get(key);
    if(!st){ S.authErr="No account found. Create one first."; render(); return; }
    if(st.pass!==pass){ S.authErr="Incorrect password."; render(); return; }
    if(st.lastLogin!==today()){ st.dailySessions={}; st.lastLogin=today(); LS.set(key,st); }
    S.user=st; S.screen="home"; S.authErr=""; render();
    toast("Welcome back, "+st.name.split(' ')[0]+" 🧠");
  } else {
    if(LS.get(key)){ S.authErr="That email is already registered."; render(); return; }
    const u={ email:mail.toLowerCase(), name:name, pass:pass,
      points:0, gold:0, diamonds:0, level:1, xp:0, totalPts:0, streak:1,
      lastLogin:today(), dailySessions:{}, totalSessions:0, badges:[],
      joinDate:new Date().toLocaleDateString('en-IN') };
    LS.set(key,u);
    S.pendingMail=mail.toLowerCase();
    S.onboard=0; S.authErr=""; render();
  }
}

function demoAccount(){
  const mail="demo@prajnify.com", key="praj_"+mail;
  let u=LS.get(key);
  if(!u){
    u={ email:mail, name:"Demo Explorer", pass:"demo",

        lastLogin:today(), dailySessions:{math:3,logic:1,gk:2}, totalSessions:12, badges:[],
        joinDate:new Date().toLocaleDateString('en-IN') };
    LS.set(key,u);
  }
  if(u.lastLogin!==today()){ u.dailySessions={}; u.lastLogin=today(); LS.set(key,u); }
  S.user=u; S.screen="home"; render();
  toast("Demo account loaded — explore freely 🚀");
}

function doBuy(i){
  const it=STORE[i], u=S.user;
  const have = it.cur==="gold" ? u.gold : u.diamonds;
  if(have < it.cost){ toast("Not enough "+it.cur+". Keep training!"); return; }
  if(it.cur==="gold") u.gold -= it.cost; else u.diamonds -= it.cost;
  saveUser(u); render();
  toast("Purchased: "+it.n+" ✓");
}

function shareCard(){
  const u=S.user, iq=iqOf(u), rk=rankOf(iq);
  const txt =
    "🧠 PRAJNIFY BRAIN PROFILE\n"+
    "─────────────────────\n"+
    u.name+"\n"+
    "Brain IQ: "+iq+"  ·  "+rk.icon+" "+rk.label+"\n"+
    "Level "+u.level+"  ·  "+u.streak+"-day streak\n"+
    "💎 "+u.diamonds+"   🥇 "+u.gold+"   ⚡ "+u.points+"\n"+
    u.totalSessions+" sessions completed\n"+
    "─────────────────────\n"+
    "Verified by Prajnify · prajnify.com";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      ()=>toast("Brain Profile copied to clipboard ✓"),
      ()=>toast("Copy failed — select the text manually.")
    );
  } else {
    toast("Clipboard unavailable in this browser.");
  }
}

   BOOT
═══════════════════════════════════════════════════ */
(function boot(){
  const last = LS.get("praj_last");
  if(last){
    const u = LS.get("praj_"+last);
    if(u){
      if(u.lastLogin!==today()){ u.dailySessions={}; u.lastLogin=today(); LS.set("praj_"+last,u); }
      S.user=u; S.screen="home";
    }
  }
  render();
})();

/* remember last session */
window.addEventListener('beforeunload', function(){
  if(S.user) LS.set("praj_last", S.user.email);
});
setInterval(function(){ if(S.user) LS.set("praj_last", S.user.email); }, 5000);
